<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="playingcard.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main id="playing-cards">
        <!-- card one -->
        <div class="card">
            <div class="left">
                <p>♠️</p>
                <p>K</p>
            </div>
            <div class="middle">
                <p>♠️</p>
                <p>♠️</p>
                <p>♠️</p>
            </div>
            <div class="right">
                <p>♠️</p>
                <p class="risk">K</p>
            </div>
        </div>

        <!-- card two -->
        <div class="card">
             <div class="left">
                <p>🔶</p>
                <p>A</p>
            </div>
            <div class="middle">
                <p>🔶</p>
                <p>🔶</p>
                <p>🔶</p>
            </div>
            <div class="right">
                <p>🔶</p>
                <p class="risk">A</p>
            </div>
        </div>
<!-- card three -->
        <div class="card">
             <div class="left">
               <p>❤️</p>
                <p>P</p>
            </div>
            <div class="middle">
                <p>❤️</p>
                <p>❤️</p>
                <p>❤️</p>

            </div>
            <div class="right">
                <p>❤️</p>
                <p class="risk">P</p>
            </div>
        </div>


    </main>

   
    
</body>
</html>
